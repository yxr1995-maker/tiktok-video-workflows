name: video-env-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dry-run-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Referenced flow2api fork branch still exists
        env:
          FORK: https://github.com/yxr1995-maker/flow2api.git
        run: |
          branch=$(grep -m1 '^- flow2api fork' workflows/tiktok-video.md | grep -o '`[^`]*`' | tail -1 | tr -d '`')
          echo "doc references branch: $branch"
          test -n "$branch"
          git ls-remote --exit-code --heads "$FORK" "$branch"
      - name: Syntax and sanity check videoctl
        run: |
          python3 -m py_compile videoctl.py scripts/videoctl.py
          python3 videoctl.py --help
      - name: Run unit and integration tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
